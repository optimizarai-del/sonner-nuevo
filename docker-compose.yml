# Stack del agente de SONNER (Tomi externo + agente interno).
#
# La base de datos es SUPABASE, que es un servicio administrado al que el agente le pega
# por HTTPS. Por eso acá NO hay Postgres: levantarlo sería una segunda base vacía que
# nadie usa. (El docker-compose.yml de la raíz sí tiene uno, pero es del desarrollo local
# del backend viejo.)
#
# Lo único que se levanta al lado del agente es Redis, y hace tres trabajos concretos:
#   1. Agrupar los mensajes que el cliente manda de a pedacitos (ventana de 15s).
#   2. No contestar dos veces el mismo mensaje si n8n reintenta el webhook.
#   3. Que el watchdog y el resumen de las 20:00 se disparen UNA vez, no una por worker.
# Sin Redis el agente funciona igual, pero esas tres cosas pasan a vivir en la memoria del
# proceso y hay que volver a WEB_CONCURRENCY=1.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: si Redis se reinicia, no quiero perder los "ya contesté este mensaje"
    # y arriesgar una respuesta duplicada a un cliente. El maxmemory es un techo para que
    # Redis nunca se coma la RAM del servidor: los datos reales son unos pocos KB.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # Sin `ports`: solo lo alcanza el agente por la red interna del compose.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  agente:
    build:
      context: ./backend
      dockerfile: Dockerfile.agente
    restart: unless-stopped
    ports:
      - "8000:8000"
    # De dónde salen las variables:
    #   EasyPanel: de la sección Environment del servicio. El panel las inyecta por su
    #              docker-compose.override.yml, no por un archivo en el repo.
    #   Local:     cp backend/.env .env
    # Por eso el .env es OPCIONAL (`required: false`): en el servidor no existe —el .env
    # está en .gitignore, los secretos no viajan en el repo— y si fuera obligatorio el
    # deploy se caería antes de arrancar. La lista completa está en backend/.env.example.
    env_file:
      - path: .env
        required: false
    environment:
      # Estas dos las fija el stack, no el .env: el hostname es el del servicio de al lado.
      REDIS_URL: "redis://redis:6379/0"
      # Con Redis andando se puede subir. Si sacás Redis, volvé a 1.
      WEB_CONCURRENCY: "2"
    depends_on:
      redis:
        condition: service_healthy
    # /health es a propósito el chequeo "estoy vivo", que no mira dependencias.
    # Si usara /health/ready, un corte momentáneo de Supabase reiniciaría el contenedor
    # en loop justo cuando más conviene que siga atendiendo. El /health/ready es para
    # mirarlo desde afuera (EasyPanel, o a mano), no para decidir reinicios.
    # La imagen es python-slim y no trae curl, así que el chequeo va con urllib.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen("http://localhost:8000/health", timeout=3).status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
